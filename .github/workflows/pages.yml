name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test Python
        run: python -B -m unittest discover -s backend/tests -v
      - name: Test browser project loading
        run: node --test frontendlow/tests/*.test.mjs
      - name: Check frontend syntax
        run: |
          node --check frontendlow/app.js
          node --check frontendlow/browser-client.js
          node --check frontendlow/analysis-worker.mjs
      - name: Build static site
        run: python -B scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
